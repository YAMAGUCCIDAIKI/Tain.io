<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tain.io</title>
  <meta name="description" content="HTML5 Canvasで遊べるTain.ioブラウザゲーム">
  <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div class="score-panel">Score: <strong id="mass">0</strong></div>

  <section class="hud" aria-label="状態">
    <div class="hud-row hidden-stat"><span>細胞</span><strong id="cells">1/16</strong></div>
    <div class="hud-row hidden-stat"><span>FPS</span><strong id="fps">60</strong></div>
    <div class="hud-row version-row"><span>Ver</span><strong id="version">v2026.05.11.20</strong></div>
  </section>

  <aside class="board" aria-label="ランキング">
    <div class="board-title">Leaderboard</div>
    <div id="scoreboard"></div>
  </aside>

  <div id="flash" class="flash">復活</div>

  <button id="menuBtn" class="menu-button" type="button">設定</button>

  <section id="menuScreen" class="menu-screen" aria-label="メニュー">
    <div class="menu-head">
      <strong>Tain.io</strong>
      <button id="playBtn" type="button">PLAY</button>
    </div>
    <div class="menu-layout">
      <div class="menu-tabs" role="tablist" aria-label="メニューページ">
        <button class="menu-tab active" type="button" data-menu-page="home">プレイ</button>
        <button class="menu-tab" type="button" data-menu-page="settings">設定</button>
      </div>

      <div id="menuPageHome" class="menu-page home-page active" data-menu-page-panel="home">
        <section class="profile-panel" aria-label="プロフィール">
          <input id="nameBox" maxlength="18" spellcheck="false" aria-label="名前" placeholder="name">
          <input id="cloneNameBox" maxlength="18" spellcheck="false" aria-label="別個体の名前" placeholder="name2">
        </section>

        <section class="online-panel" aria-label="オンライン">
          <div class="online-title">
            <span>オンライン2人</span>
            <span id="onlineStatus" class="online-status">オフライン</span>
          </div>
          <div class="online-controls">
            <button id="hostBtn" type="button">オンライン参加</button>
            <button id="disconnectBtn" type="button">切断</button>
            <button id="spectateBtn" type="button">観戦</button>
          </div>
          <div class="online-fields">
            <input id="roomBox" spellcheck="false" aria-label="部屋名" placeholder="部屋名">
          </div>
        </section>
      </div>

      <section id="menuPageSettings" class="menu-page settings-page" data-menu-page-panel="settings" aria-label="設定">
        <div class="view-panel">
        <div class="view-row"><span>表示</span><strong id="viewValue">100%</strong></div>
        <div class="view-controls">
          <button id="gameResetBtn" type="button">リセット</button>
        </div>
        <label class="setting-control">
          <span>カーソル線</span>
          <input id="cursorLineToggle" class="toggle-input" type="checkbox" checked aria-label="カーソルライン">
          <strong id="cursorLineValue" class="toggle-value">表示</strong>
        </label>
        <label class="setting-control">
          <span>N復活</span>
          <input id="nRespawnToggle" class="toggle-input" type="checkbox" checked aria-label="Nキーリスタート">
          <strong id="nRespawnValue" class="toggle-value">許可</strong>
        </label>
        <label class="setting-control">
          <span>操作色</span>
          <input id="activeColorToggle" class="toggle-input" type="checkbox" checked aria-label="操作中の細胞色">
          <strong id="activeColorValue" class="toggle-value">表示</strong>
        </label>
        <label class="setting-control">
          <span>他人マス</span>
          <input id="otherMassToggle" class="toggle-input" type="checkbox" aria-label="自分以外のマス表示">
          <strong id="otherMassValue" class="toggle-value">非表示</strong>
        </label>
        <label class="setting-control">
          <span>自分マス</span>
          <input id="ownMassToggle" class="toggle-input" type="checkbox" checked aria-label="自分のマス表示">
          <strong id="ownMassValue" class="toggle-value">表示</strong>
        </label>
        <div class="keybind-title">キー</div>
        <div class="keybind-grid">
          <label class="keybind-control"><span>分裂</span><button type="button" data-keybind="split1"></button></label>
          <label class="keybind-control"><span>2分裂</span><button type="button" data-keybind="split2"></button></label>
          <label class="keybind-control"><span>3分裂</span><button type="button" data-keybind="split3"></button></label>
          <label class="keybind-control"><span>4分裂</span><button type="button" data-keybind="split4"></button></label>
          <label class="keybind-control"><span>粒</span><button type="button" data-keybind="eject"></button></label>
          <label class="keybind-control"><span>連射</span><button type="button" data-keybind="autoEject"></button></label>
          <label class="keybind-control"><span>別個体</span><button type="button" data-keybind="clone"></button></label>
          <label class="keybind-control"><span>復活</span><button type="button" data-keybind="respawn"></button></label>
          <label class="keybind-control"><span>Bot分裂</span><button type="button" data-keybind="botSplit"></button></label>
          <label class="keybind-control"><span>Bot粒</span><button type="button" data-keybind="botEject"></button></label>
        </div>
        <div class="settings-category">BOT</div>
        <label class="setting-control">
          <span>Bot有効</span>
          <input id="botEnabledToggle" class="toggle-input" type="checkbox" checked aria-label="Bot有効">
          <strong id="botEnabledValue" class="toggle-value">ON</strong>
        </label>
        <label class="setting-control">
          <span>ボット</span>
          <input id="botMinBox" class="max-input" type="number" min="0" step="1" value="0" aria-label="ボット下限">
          <input id="botSlider" type="range" min="0" max="200" step="1" value="100" aria-label="ボット数">
          <strong id="botValue">100</strong>
          <input id="botMaxBox" class="max-input" type="number" min="1" step="1" value="200" aria-label="ボット上限">
        </label>
        <label class="setting-control">
          <span>Bot初期マス</span>
          <input id="botSpawnMassMinBox" class="max-input" type="number" min="12" step="1" value="12" aria-label="Bot初期マス下限">
          <input id="botSpawnMassSlider" type="range" min="12" max="5000" step="1" value="132" aria-label="Bot初期マス">
          <strong id="botSpawnMassValue">132</strong>
          <input id="botSpawnMassMaxBox" class="max-input" type="number" min="12" step="1" value="5000" aria-label="Bot初期マス上限">
        </label>
        <label class="setting-control">
          <span>Bot連射</span>
          <input id="botEjectRateMinBox" class="max-input" type="number" min="1" step="1" value="1" aria-label="Bot連射下限">
          <input id="botEjectRateSlider" type="range" min="1" max="50" step="1" value="11" aria-label="Botの粒連射速度">
          <strong id="botEjectRateValue">11</strong>
          <input id="botEjectRateMaxBox" class="max-input" type="number" min="1" step="1" value="50" aria-label="Bot連射上限">
        </label>
        <label class="setting-control">
          <span>行動</span>
          <select id="botModeSelect" class="mode-select" aria-label="ボット行動">
            <option value="hunt">小さい相手を狙う</option>
            <option value="chase">プレイヤーを追う</option>
            <option value="virus">とげを狙う</option>
            <option value="cursor">カーソルへ向かう</option>
            <option value="eject">粒吐き</option>
          </select>
        </label>
        <div class="settings-category">分裂</div>
        <label class="setting-control">
          <span>反動</span>
          <input id="splitRecoilMinBox" class="max-input" type="number" min="0" step="1" value="0" aria-label="反動下限">
          <input id="splitRecoilSlider" type="range" min="0" max="40" step="1" value="0" aria-label="分裂反動の大きさ">
          <strong id="splitRecoilValue">0</strong>
          <input id="splitRecoilMaxBox" class="max-input" type="number" min="1" step="1" value="40" aria-label="反動上限">
        </label>
        <label class="setting-control">
          <span>分裂速度</span>
          <input id="splitSpeedMinBox" class="max-input" type="number" min="10" step="5" value="10" aria-label="分裂速度下限">
          <input id="splitSpeedSlider" type="range" min="10" max="300" step="5" value="110" aria-label="分裂速度">
          <strong id="splitSpeedValue">110</strong>
          <input id="splitSpeedMaxBox" class="max-input" type="number" min="10" step="5" value="300" aria-label="分裂速度上限">
        </label>
        <label class="setting-control">
          <span>減速時間</span>
          <input id="splitDecayTimeMinBox" class="max-input" type="number" min="0.1" step="0.1" value="0.1" aria-label="分裂減速時間下限">
          <input id="splitDecayTimeSlider" type="range" min="0.1" max="2" step="0.1" value="0.7" aria-label="分裂速度が移動速度まで下がる時間">
          <strong id="splitDecayTimeValue">0.7秒</strong>
          <input id="splitDecayTimeMaxBox" class="max-input" type="number" min="0.1" step="0.1" value="2" aria-label="分裂減速時間上限">
        </label>
        <label class="setting-control">
          <span>GRT分裂間隔</span>
          <input id="splitInputSpeedMinBox" class="max-input" type="number" min="0" max="500" step="10" value="0" aria-label="GRT分裂間隔下限">
          <input id="splitInputSpeedSlider" type="range" min="0" max="500" step="10" value="0" aria-label="GRT分裂間隔">
          <strong id="splitInputSpeedValue">0ms</strong>
          <input id="splitInputSpeedMaxBox" class="max-input" type="number" min="0" max="2000" step="10" value="500" aria-label="GRT分裂間隔上限">
        </label>
        <div class="settings-category">棘・粒</div>
        <label class="setting-control">
          <span>自然とげ</span>
          <input id="virusMinBox" class="max-input" type="number" min="0" step="1" value="0" aria-label="自然発生とげ下限">
          <input id="virusSlider" type="range" min="0" max="500" step="1" value="36" aria-label="自然発生とげ数">
          <strong id="virusValue">36</strong>
          <input id="virusMaxBox" class="max-input" type="number" min="1" step="1" value="500" aria-label="自然発生とげ上限">
        </label>
        <label class="setting-control">
          <span>ペレット</span>
          <input id="foodMinBox" class="max-input" type="number" min="0" step="100" value="0" aria-label="ペレット下限">
          <input id="foodSlider" type="range" min="0" max="100000" step="100" value="1200" aria-label="ペレット数">
          <strong id="foodValue">1200</strong>
          <input id="foodMaxBox" class="max-input" type="number" min="100" step="100" value="100000" aria-label="ペレット上限">
        </label>
        <label class="setting-control">
          <span>初期マス</span>
          <input id="spawnMassMinBox" class="max-input" type="number" min="132" step="1" value="132" aria-label="初期マス下限">
          <input id="spawnMassSlider" type="range" min="132" max="5000" step="1" value="132" aria-label="初期スポーンマス">
          <strong id="spawnMassValue">132</strong>
          <input id="spawnMassMaxBox" class="max-input" type="number" min="132" step="1" value="5000" aria-label="初期マス上限">
        </label>
        <label class="setting-control">
          <span>吐く量</span>
          <input id="ejectMassMinBox" class="max-input" type="number" min="5" step="1" value="5" aria-label="吐く量下限">
          <input id="ejectMassSlider" type="range" min="5" max="80" step="1" value="21" aria-label="吐く粒の大きさ">
          <strong id="ejectMassValue">21</strong>
          <input id="ejectMassMaxBox" class="max-input" type="number" min="5" step="1" value="80" aria-label="吐く量上限">
        </label>
        <label class="setting-control">
          <span>粒速度</span>
          <input id="ejectSpeedMinBox" class="max-input" type="number" min="300" step="10" value="300" aria-label="粒速度下限">
          <input id="ejectSpeedSlider" type="range" min="300" max="1400" step="10" value="710" aria-label="吐く粒の速度">
          <strong id="ejectSpeedValue">710</strong>
          <input id="ejectSpeedMaxBox" class="max-input" type="number" min="300" step="10" value="1400" aria-label="粒速度上限">
        </label>
        <label class="setting-control">
          <span>連射</span>
          <input id="ejectRateMinBox" class="max-input" type="number" min="1" step="1" value="1" aria-label="連射下限">
          <input id="ejectRateSlider" type="range" min="1" max="50" step="1" value="11" aria-label="粒の連射速度">
          <strong id="ejectRateValue">11</strong>
          <input id="ejectRateMaxBox" class="max-input" type="number" min="1" step="1" value="50" aria-label="連射上限">
        </label>
        <div class="settings-category">ゲーム</div>
        <label class="setting-control">
          <span>ゲーム速度</span>
          <input id="gameSpeedMinBox" class="max-input" type="number" min="0.1" step="0.1" value="0.1" aria-label="ゲーム速度下限">
          <input id="gameSpeedSlider" type="range" min="0.1" max="3" step="0.1" value="1" aria-label="ゲーム速度">
          <strong id="gameSpeedValue">1x</strong>
          <input id="gameSpeedMaxBox" class="max-input" type="number" min="0.1" step="0.1" value="3" aria-label="ゲーム速度上限">
        </label>
        <label class="setting-control">
          <span>描画範囲</span>
          <input id="renderRangeMinBox" class="max-input" type="number" min="35" step="5" value="35" aria-label="描画範囲下限">
          <input id="renderRangeSlider" type="range" min="35" max="120" step="5" value="65" aria-label="描画候補の見える範囲">
          <strong id="renderRangeValue">65%</strong>
          <input id="renderRangeMaxBox" class="max-input" type="number" min="35" step="5" value="120" aria-label="描画範囲上限">
        </label>
        <label class="setting-control">
          <span>合体</span>
          <input id="mergeCooldownMinBox" class="max-input" type="number" min="0" step="1" value="0" aria-label="合体時間下限">
          <input id="mergeCooldownSlider" type="range" min="0" max="60" step="1" value="30" aria-label="合体までの時間">
          <strong id="mergeCooldownValue">30</strong>
          <input id="mergeCooldownMaxBox" class="max-input" type="number" min="1" step="1" value="60" aria-label="合体時間上限">
        </label>
        <label class="setting-control">
          <span>中止後合体</span>
          <input id="mergeCancelCooldownMinBox" class="max-input" type="number" min="0" step="0.1" value="0" aria-label="合体中止後の再合体禁止時間下限">
          <input id="mergeCancelCooldownSlider" type="range" min="0" max="10" step="0.1" value="3" aria-label="合体中止後の再合体禁止時間">
          <strong id="mergeCancelCooldownValue">3.0秒</strong>
          <input id="mergeCancelCooldownMaxBox" class="max-input" type="number" min="0.1" step="0.1" value="10" aria-label="合体中止後の再合体禁止時間上限">
        </label>
        <label class="setting-control">
          <span>広さ</span>
          <input id="worldSizeMinBox" class="max-input" type="number" min="2000" step="100" value="2000" aria-label="広さ下限">
          <input id="worldSizeSlider" type="range" min="2000" max="15000" step="100" value="5000" aria-label="サーバーの広さ">
          <strong id="worldSizeValue">5000</strong>
          <input id="worldSizeMaxBox" class="max-input" type="number" min="2000" step="100" value="15000" aria-label="広さ上限">
        </label>
        </div>
      </section>
    </div>
  </section>

  <script src="./data/version.js?v=v2026.05.11.20"></script>
  <script src="./data/palettes.js?v=v2026.05.11.20"></script>
  <script src="./data/keybindings.js?v=v2026.05.11.20"></script>
  <script src="./data.js?v=v2026.05.11.20"></script>
  <script src="./script.js?v=v2026.05.11.20"></script>
</body>
</html>
